<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/blocks.css">
  <style>
    body { background: var(--sage); }

    /* ===== レイアウト：PC=左サイドバー＋右カード / SP=1カラム ===== */
    .site-wrap { min-height: 100vh; }

    /* SP（既定）: スマホ幅で中央寄せの1カラム。ページ全体が通常スクロール
       （内部スクロールコンテナを作らない＝iOSのスクロール閉じ込めを回避） */
    .site-card {
      max-width: 480px; margin: 0 auto; background: var(--pink); min-height: 100vh;
      position: relative; overflow: visible;
    }
    .site-sidebar { display: none; }

    /* ページ内ナビ（追従バナーとは別。複数ページ時のヘッダタブ） */
    .site-topnav {
      position: sticky; top: 0; z-index: 30;
      display: flex; gap: 4px; padding: 10px 14px;
      background: rgba(236,217,209,0.94); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(51,51,51,0.08); overflow-x: auto;
    }
    .site-topnav__btn {
      font-family: var(--font-accent); font-size: 12px; letter-spacing: 0.04em;
      padding: 7px 14px; border: 0; border-radius: var(--radius-pill);
      background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap;
    }
    .site-topnav__btn.is-active { background: var(--coral); color: #fff; }
    .site-topnav[hidden] { display: none; }

    /* ===== 追従バナー（栗栖家の方はこちらも） ===== */
    .follow-banner {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 40; max-width: 440px; width: calc(100% - 32px);
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, var(--coral) 0%, #d9614a 100%);
      color: #fff; text-decoration: none;
      padding: 14px 20px; border-radius: var(--radius-pill);
      box-shadow: 0 8px 28px rgba(236,119,91,0.45), 0 2px 8px rgba(0,0,0,0.15);
      font-size: 13px; line-height: 1.4;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: bannerPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes bannerPop {
      from { transform: translateX(-50%) translateY(20px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
    }
    .follow-banner:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 12px 36px rgba(236,119,91,0.55), 0 2px 8px rgba(0,0,0,0.15); }
    .follow-banner__icon { font-size: 20px; flex: 0 0 auto; }
    .follow-banner__body { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .follow-banner__label { font-size: 10px; opacity: 0.85; letter-spacing: 0.08em; font-family: var(--font-accent); }
    .follow-banner__arrow { font-size: 22px; flex: 0 0 auto; font-weight: 300; opacity: 0.9; }
    .follow-banner[hidden] { display: none; }

    .site-loading { padding: 80px 24px; text-align: center; color: var(--muted); font-family: var(--font-accent); }

    /* ===== パスワードゲート ===== */
    .site-gate {
      position: fixed; inset: 0; z-index: 200;
      background: var(--sage);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .site-gate__card {
      background: var(--pink); border-radius: var(--radius);
      padding: 48px 32px; max-width: 360px; width: 100%;
      text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    }
    .site-gate__title {
      font-family: var(--font-display); font-size: 22px; font-weight: 400;
      letter-spacing: 0.12em; margin-bottom: 8px;
    }
    .site-gate__sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; letter-spacing: 0.06em; }
    .site-gate__input {
      width: 100%; font: inherit; font-size: 16px; padding: 14px 16px;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--paper); color: var(--ink); text-align: center;
      letter-spacing: 0.1em; margin-bottom: 14px;
    }
    .site-gate__input:focus { outline: none; border-color: var(--coral); }
    .site-gate__btn {
      width: 100%; font: inherit; font-size: 15px; font-weight: 600;
      padding: 14px; border: 0; border-radius: var(--radius-pill);
      background: var(--coral); color: #fff; cursor: pointer;
      transition: background var(--motion) ease;
    }
    .site-gate__btn:hover { background: var(--coral-deep); }
    .site-gate__err { font-size: 13px; color: var(--coral); margin-top: 12px; }

    /* ===== スクロールアニメーション（バウンス登場） ===== */
    @keyframes blockBounceIn {
      0%   { opacity: 0; transform: translateY(40px) scale(0.94); }
      55%  { opacity: 1; transform: translateY(-8px) scale(1.02); }
      75%  { transform: translateY(4px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .wb-block {
      opacity: 0;
      transform: translateY(40px) scale(0.94);
    }
    .wb-block.is-visible {
      animation: blockBounceIn 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    }
    .wb-block[data-type="cover"] {
      opacity: 1; transform: none; animation: none;
    }

    /* ===== ページ切替スライドトランジション ===== */
    @keyframes pageSlideIn {
      from { opacity: 0; transform: translateX(32px) scale(0.97); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    .wb-page.page-enter {
      animation: pageSlideIn 0.42s cubic-bezier(0.34, 1.3, 0.64, 1) both;
    }

    /* ===== ボタン弾む ===== */
    .wb-pill, .site-gate__btn, .sb-cta {
      transition: transform 0.15s cubic-bezier(0.34,1.6,0.64,1), box-shadow 0.15s ease, background 0.2s ease !important;
    }
    .wb-pill:hover, .site-gate__btn:hover, .sb-cta:hover {
      transform: scale(1.06) translateY(-2px) !important;
    }
    .wb-pill:active, .site-gate__btn:active, .sb-cta:active {
      transform: scale(0.95) !important;
    }

    /* ===== カバー文字ポンポン登場 ===== */
    @keyframes charPop {
      0%   { opacity: 0; transform: translateY(16px) scale(0.7) rotate(-4deg); }
      65%  { transform: translateY(-4px) scale(1.08) rotate(1deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }
    .cover-char {
      display: inline-block;
      opacity: 0;
      animation: charPop 0.5s cubic-bezier(0.34,1.5,0.64,1) both;
    }

    /* ===== カウントダウン数字ポン ===== */
    @keyframes numPop {
      0%  { transform: scale(1.4); color: var(--coral); }
      100%{ transform: scale(1);   color: inherit; }
    }
    .num-pop { animation: numPop 0.35s cubic-bezier(0.34,1.6,0.64,1); }

    /* ===== PC（920px〜）: 左固定サイドバー＋右スマホ幅カード（カード内だけスクロール） ===== */
    @media (min-width: 920px) {
      /* 画面全体は固定。スクロールするのは右カードの中だけ。 */
      html, body { height: 100%; overflow: hidden; }
      .site-wrap {
        display: grid;
        grid-template-columns: 1fr minmax(380px, 460px);
        gap: 40px;
        max-width: 1080px; margin: 0 auto;
        padding: 40px 24px;
        align-items: stretch;
        height: 100vh;
        height: 100dvh;          /* モバイル系PCブラウザのUIバー対策 */
      }
      .site-sidebar {
        display: block;
        align-self: center;       /* 左サイドバーは中央あたりに固定表示 */
      }
      .site-sidebar__inner {
        background: var(--pink); border-radius: var(--radius);
        padding: 36px 30px; text-align: center;
      }
      .sb-names { font-family: var(--font-display); font-size: 22px; font-weight: 500; }
      .sb-date { font-size: 30px; font-weight: 500; letter-spacing: 0.02em; margin-top: 10px; font-family: var(--font-display); }
      .sb-sub { font-size: 13px; color: var(--muted); margin-top: 6px; letter-spacing: 0.08em; }
      .sb-cd { display: flex; justify-content: center; gap: 16px; margin-top: 22px; }
      .sb-cd > div { display: flex; flex-direction: column; }
      .sb-cd b { font-family: var(--font-display); font-size: 26px; font-weight: 500; line-height: 1; }
      .sb-cd i { font-family: var(--font-accent); font-size: 9px; letter-spacing: 0.1em; color: var(--muted); font-style: normal; margin-top: 4px; text-transform: uppercase; }
      .sb-note {
        margin-top: 26px; background: var(--pinkSoft); border-radius: var(--radius);
        padding: 18px; font-size: 12px; color: var(--muted); line-height: 1.9;
      }
      .sb-note u { color: var(--ink); text-underline-offset: 3px; }
      .sb-cta {
        display: block; width: 100%; margin-top: 14px; text-align: center;
        font-family: var(--font-body); font-size: 14px; padding: 13px;
        border: 0; border-radius: var(--radius-pill); background: var(--coral); color: #fff;
        cursor: pointer; text-decoration: none; transition: background var(--motion) ease;
      }
      .sb-cta:hover { background: var(--coral-deep); }

      /* カードは固定高さの内部スクロールコンテナ（参考サイトの「枠の中だけ動く」挙動） */
      .site-card {
        max-width: none; margin: 0; min-height: 0;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
      }
      .site-card::-webkit-scrollbar { width: 8px; }
      .site-card::-webkit-scrollbar-thumb { background: rgba(51,51,51,0.18); border-radius: 8px; }
      /* topnav はカード内 overflow:auto の中で sticky 固定（カードの上端に貼り付く） */
      .site-topnav { border-radius: var(--radius) var(--radius) 0 0; }
      .follow-banner { left: auto; right: 24px; transform: none; max-width: 320px; animation: none; }
      .follow-banner:hover { transform: translateY(-2px); }
    }
  </style>
</head>
<body>
  <!-- パスワードゲート -->
  <div id="siteGate" class="site-gate">
    <div class="site-gate__card">
      <p class="site-gate__title">Wedding Invitation</p>
      <p class="site-gate__sub">合言葉を入力してください</p>
      <input id="siteGateInput" class="site-gate__input" type="password" placeholder="合言葉">
      <button id="siteGateBtn" class="site-gate__btn">開く</button>
      <p id="siteGateErr" class="site-gate__err" hidden>合言葉が違います</p>
    </div>
  </div>

  <div id="siteApp" style="display:none">
  <div class="site-wrap">
    <!-- PC: 左サイドバー -->
    <aside class="site-sidebar" id="sidebar"></aside>

    <!-- スマホ幅カード（本体） -->
    <div class="site-card">
      <nav class="site-topnav" id="topnav" hidden></nav>
      <main class="wb-page" id="site">
        <div class="site-loading">読み込み中…</div>
      </main>
    </div>
  </div>

  <!-- 追従バナー -->
  <a class="follow-banner" id="followBanner" hidden href="#">
    <span class="follow-banner__icon">🗺</span>
    <span class="follow-banner__body">
      <span class="follow-banner__label">栗栖家の皆様へ</span>
      <span id="followText">旅のしおりはこちら</span>
    </span>
    <span class="follow-banner__arrow" aria-hidden="true">›</span>
  </a>
  </div><!-- /#siteApp -->

  <script src="core/theme.js"></script>
  <script src="core/render.js"></script>
  <script src="core/schema.js"></script>
  <script src="core/storage.js"></script>
  <script src="core/seed.js"></script>
  <script>
    /* ===== フロント パスワードゲート ===== */
    (function () {
      var HASH = '910da0136c05b8f513f7222aa62affcb4c991add8c5dd1812311ae5870f6be31';
      var KEY  = 'wedi-front-access';
      var gate = document.getElementById('siteGate');
      var app  = document.getElementById('siteApp');
      function unlock() { gate.style.display = 'none'; app.style.display = ''; }
      if (localStorage.getItem(KEY) === '1') { unlock(); return; }
      var input = document.getElementById('siteGateInput');
      var btn   = document.getElementById('siteGateBtn');
      var err   = document.getElementById('siteGateErr');
      function tryUnlock() {
        var v = input.value;
        crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function (buf) {
          var hex = Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2,'0'); }).join('');
          if (hex === HASH) { localStorage.setItem(KEY, '1'); err.hidden = true; unlock(); }
          else { err.hidden = false; input.select(); }
        });
      }
      btn.addEventListener('click', tryUnlock);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { tryUnlock(); } });
    })();
    (function () {
      'use strict';
      var WEDI = window.WEDI;
      var site = document.getElementById('site');
      var card = document.querySelector('.site-card');
      var topnav = document.getElementById('topnav');
      var sidebar = document.getElementById('sidebar');
      var banner = document.getElementById('followBanner');
      var followText = document.getElementById('followText');

      /* PC ではカード内スクロール、SP ではウィンドウスクロールを先頭に戻す */
      function scrollToTop() {
        if (card && card.scrollHeight > card.clientHeight + 1) { card.scrollTop = 0; }
        window.scrollTo(0, 0);
      }

      /* localStorage と seed.js の新しい方を表示（deploy 済み seed が古い localStorage に隠されないように） */
      var doc = WEDI.storage.pickNewer(WEDI.storage.load(), WEDI.seed);
      if (!doc || !doc.pages || !doc.pages.length) {
        site.innerHTML = '<div class="site-loading">まだ内容がありません。エディターで作成してください。</div>';
        return;
      }
      WEDI.theme.applyTheme(document.documentElement, doc.theme);

      var activeId = doc.pages[0].id;
      if (location.hash) {
        var slug = location.hash.slice(1);
        var m = doc.pages.filter(function (p) { return p.slug === slug || p.id === slug; })[0];
        if (m) { activeId = m.id; }
      }

      function pageById(id) {
        return doc.pages.filter(function (p) { return p.id === id; })[0] || doc.pages[0];
      }

      function renderPage(pageId) {
        var page = pageById(pageId);
        site.innerHTML = '';
        site.classList.remove('page-enter');
        var frag = WEDI.render.renderPage(page, doc.theme, { editor: false });
        site.appendChild(frag);
        Array.prototype.forEach.call(site.children, function (sectionEl, i) {
          var block = page.blocks[i];
          if (block) { WEDI.render.hydrate(sectionEl, block); }
        });
        // ページ切替スライドアニメ
        void site.offsetWidth;
        site.classList.add('page-enter');
        scrollToTop();
        initScrollAnim();
        initCoverAnim();
        initCountdownPop();
      }

      function renderTopnav() {
        if (doc.pages.length <= 1) { topnav.hidden = true; return; }
        topnav.hidden = false;
        topnav.innerHTML = '';
        doc.pages.forEach(function (page) {
          var btn = document.createElement('button');
          btn.className = 'site-topnav__btn' + (page.id === activeId ? ' is-active' : '');
          btn.textContent = page.name || 'Page';
          btn.addEventListener('click', function () { goPage(page.id); });
          topnav.appendChild(btn);
        });
      }

      function goPage(id) {
        activeId = id;
        var page = pageById(id);
        if (page.slug) { history.replaceState(null, '', '#' + page.slug); }
        renderTopnav();
        renderPage(id);
        updateBanner();
      }

      /* ---- 追従バナー: 今表示していない「別ページ」へ誘導 ---- */
      function updateBanner() {
        // 2ページ以上ある時だけ。今が招待状なら「しおり」へ、しおりなら「招待状」へ。
        if (doc.pages.length < 2) { banner.hidden = true; return; }
        var other = doc.pages.filter(function (p) { return p.id !== activeId; })[0];
        if (!other) { banner.hidden = true; return; }
        banner.hidden = false;
        // しおり系のページなら専用文言、それ以外は汎用
        var isGuide = /しおり|guide|旅/.test(other.name + ' ' + other.slug);
        followText.textContent = isGuide
          ? '栗栖家の方はこちらもご確認ください'
          : other.name + ' はこちら';
        banner.onclick = function (ev) { ev.preventDefault(); goPage(other.id); };
      }

      /* ---- PC サイドバー（招待状ページの情報を表示） ---- */
      function renderSidebar() {
        var home = doc.pages[0];
        var cover = home.blocks.filter(function (b) { return b.type === 'cover'; })[0];
        var cd = home.blocks.filter(function (b) { return b.type === 'countdown'; })[0];
        var rsvp = home.blocks.filter(function (b) { return b.type === 'rsvp'; })[0];
        var names = cover ? (cover.data.names || '') : '';
        var date = cover ? (cover.data.date || '') : '';
        var deadline = rsvp ? (rsvp.data.deadline || '') : '';
        var esc = WEDI.render.esc;

        sidebar.innerHTML =
          '<div class="site-sidebar__inner">' +
            (names ? '<p class="sb-names">' + esc(names) + '</p>' : '') +
            (date ? '<p class="sb-date">' + esc(date) + '</p>' : '') +
            '<p class="sb-sub" id="sbSub"></p>' +
            '<div class="sb-cd">' +
              '<div><b data-u="days">―</b><i>days</i></div>' +
              '<div><b data-u="hours">―</b><i>hours</i></div>' +
              '<div><b data-u="minutes">―</b><i>min</i></div>' +
              '<div><b data-u="seconds">―</b><i>sec</i></div>' +
            '</div>' +
            (deadline ? '<div class="sb-note">お手数ではございますが<br><u>' + esc(deadline) + '</u> までに<br>ご一報くださいますようお願いします</div>' : '') +
            '<a class="sb-cta" id="sbCta" href="#">招待状に回答</a>' +
          '</div>';

        // カウントダウン駆動
        if (cd && cd.data.target) {
          var target = new Date(cd.data.target);
          if (!isNaN(target.getTime())) {
            var u = {
              days: sidebar.querySelector('[data-u="days"]'),
              hours: sidebar.querySelector('[data-u="hours"]'),
              minutes: sidebar.querySelector('[data-u="minutes"]'),
              seconds: sidebar.querySelector('[data-u="seconds"]')
            };
            var pad = function (n) { return (n < 10 ? '0' : '') + n; };
            var tick = function () {
              var s = Math.max(0, Math.floor((target.getTime() - Date.now()) / 1000));
              u.days.textContent = Math.floor(s / 86400);
              u.hours.textContent = pad(Math.floor((s % 86400) / 3600));
              u.minutes.textContent = pad(Math.floor((s % 3600) / 60));
              u.seconds.textContent = pad(s % 60);
            };
            tick(); setInterval(tick, 1000);
          }
        }
        // CTA → 招待状ページの RSVP へスクロール
        var cta = sidebar.querySelector('#sbCta');
        if (cta) {
          cta.addEventListener('click', function (ev) {
            ev.preventDefault();
            if (activeId !== doc.pages[0].id) { goPage(doc.pages[0].id); }
            setTimeout(function () {
              var rsvpEl = site.querySelector('[data-type="rsvp"]');
              if (rsvpEl) { rsvpEl.scrollIntoView({ behavior: 'smooth' }); }
            }, 60);
          });
        }
      }

      renderSidebar();
      renderTopnav();
      renderPage(activeId);
      updateBanner();

      // ---- スクロールアニメーション（バウンス登場） ----
      function initScrollAnim() {
        var els = Array.prototype.slice.call(site.querySelectorAll('.wb-block:not(.is-visible)'));
        if (!els.length || !window.IntersectionObserver) {
          site.querySelectorAll('.wb-block').forEach(function (el) { el.classList.add('is-visible'); });
          return;
        }
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) {
              // staggered delay（順番にずらして登場）
              var idx = els.indexOf(e.target);
              e.target.style.animationDelay = (idx * 0.06) + 's';
              e.target.classList.add('is-visible');
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.06 });
        els.forEach(function (el) { io.observe(el); });
      }

      // ---- カバーの文字を1文字ずつポンポン登場 ----
      function initCoverAnim() {
        var cover = site.querySelector('[data-type="cover"]');
        if (!cover) { return; }
        // names と date を対象
        cover.querySelectorAll('.wb-cover__names, .wb-cover__date').forEach(function (el) {
          var text = el.textContent;
          el.innerHTML = '';
          text.split('').forEach(function (ch, i) {
            var span = document.createElement('span');
            span.className = 'cover-char';
            span.textContent = ch === ' ' ? ' ' : ch;
            span.style.animationDelay = (0.3 + i * 0.07) + 's';
            el.appendChild(span);
          });
        });
      }

      // ---- カウントダウン数字が変わるたびにポンっと跳ねる ----
      function initCountdownPop() {
        var cd = site.querySelector('[data-type="countdown"]');
        if (!cd) { return; }
        var nums = cd.querySelectorAll('[data-unit]');
        nums.forEach(function (el) {
          var prev = el.textContent;
          var observer = new MutationObserver(function () {
            if (el.textContent !== prev) {
              prev = el.textContent;
              el.classList.remove('num-pop');
              void el.offsetWidth;
              el.classList.add('num-pop');
            }
          });
          observer.observe(el, { childList: true, subtree: true, characterData: true });
        });
      }

    })();
  </script>
</body>
</html>
